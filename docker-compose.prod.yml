services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - codeline_internal

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER must be set} -d ${POSTGRES_DB:?POSTGRES_DB must be set}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0

      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set; use db as the hostname inside Compose}"

      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET must be set}"

      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL must be set}"
      APP_URL: "${APP_URL:?APP_URL must be set}"
      APP_ORIGIN: "${APP_ORIGIN:?APP_ORIGIN must be set to the public HTTPS origin}"
      TRUST_PROXY: "${TRUST_PROXY:?TRUST_PROXY must be set to single-hop}"
      GA_MEASUREMENT_ID: "${GA_MEASUREMENT_ID:-}"

      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}

      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: ${STORAGE_LOCAL_DIR:-/app/uploads}

      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}

      AI_PROVIDER: ${AI_PROVIDER:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-groq/compound-mini}
      GROQ_MAX_COMPLETION_TOKENS: ${GROQ_MAX_COMPLETION_TOKENS:-4096}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      AI_RESEARCH_MAX_SCHOOLS: ${AI_RESEARCH_MAX_SCHOOLS:-100}
      AI_RESEARCH_MAX_SOURCE_REQUESTS_PER_SCHOOL: ${AI_RESEARCH_MAX_SOURCE_REQUESTS_PER_SCHOOL:-3}
      AI_RESEARCH_MAX_PROVIDER_REQUESTS: ${AI_RESEARCH_MAX_PROVIDER_REQUESTS:-24}
      AI_RESEARCH_MAX_SOURCE_REQUESTS: ${AI_RESEARCH_MAX_SOURCE_REQUESTS:-60}
      AI_RESEARCH_MAX_RETRIES: ${AI_RESEARCH_MAX_RETRIES:-8}
      AI_RESEARCH_MAX_TOKENS: ${AI_RESEARCH_MAX_TOKENS:-100000}
      AI_RESEARCH_MAX_DURATION_MS: ${AI_RESEARCH_MAX_DURATION_MS:-900000}
      AI_RESEARCH_GLOBAL_CONCURRENCY: ${AI_RESEARCH_GLOBAL_CONCURRENCY:-2}
      AI_RESEARCH_ORG_CONCURRENCY: ${AI_RESEARCH_ORG_CONCURRENCY:-1}
      AI_RESEARCH_USER_CONCURRENCY: ${AI_RESEARCH_USER_CONCURRENCY:-1}
      AI_RESEARCH_LEASE_MS: ${AI_RESEARCH_LEASE_MS:-1200000}
      AI_ASSISTANT_GLOBAL_CONCURRENCY: ${AI_ASSISTANT_GLOBAL_CONCURRENCY:-8}
      AI_ASSISTANT_ORG_CONCURRENCY: ${AI_ASSISTANT_ORG_CONCURRENCY:-3}
      AI_ASSISTANT_USER_CONCURRENCY: ${AI_ASSISTANT_USER_CONCURRENCY:-1}
      AI_ASSISTANT_LEASE_MS: ${AI_ASSISTANT_LEASE_MS:-120000}
      PROPOSAL_GENERATION_GLOBAL_CONCURRENCY: ${PROPOSAL_GENERATION_GLOBAL_CONCURRENCY:-2}
      PROPOSAL_GENERATION_ORG_CONCURRENCY: ${PROPOSAL_GENERATION_ORG_CONCURRENCY:-1}
      PROPOSAL_GENERATION_USER_CONCURRENCY: ${PROPOSAL_GENERATION_USER_CONCURRENCY:-1}
      PROPOSAL_GENERATION_LEASE_MS: ${PROPOSAL_GENERATION_LEASE_MS:-600000}
      SCHOOL_IMPORT_GLOBAL_CONCURRENCY: ${SCHOOL_IMPORT_GLOBAL_CONCURRENCY:-4}
      SCHOOL_IMPORT_ORG_CONCURRENCY: ${SCHOOL_IMPORT_ORG_CONCURRENCY:-1}
      SCHOOL_IMPORT_USER_CONCURRENCY: ${SCHOOL_IMPORT_USER_CONCURRENCY:-1}
      SCHOOL_IMPORT_LEASE_MS: ${SCHOOL_IMPORT_LEASE_MS:-1800000}
      GROQ_BATCH_SIZE: ${GROQ_BATCH_SIZE:-5}
      GROQ_ASSISTANT_MODEL: ${GROQ_ASSISTANT_MODEL:-llama-3.1-8b-instant}
      GEMINI_ASSISTANT_MODEL: ${GEMINI_ASSISTANT_MODEL:-gemini-2.0-flash-lite}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_EMAIL_INTEGRATION_PENDING_REVIEW: ${GOOGLE_EMAIL_INTEGRATION_PENDING_REVIEW:-true}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}

      CHATBOT_UPSTREAM_ORIGIN: ${CHATBOT_UPSTREAM_ORIGIN:-}
      CHATBOT_WIDGET_URL: ${CHATBOT_WIDGET_URL:-}
      CHATBOT_PROXY_ALLOWED_PATHS: ${CHATBOT_PROXY_ALLOWED_PATHS:-}

    volumes:
      - uploads_data:/app/uploads

    expose:
      - "3000"

    networks:
      - codeline_internal

  migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator

    restart: "no"

    depends_on:
      db:
        condition: service_healthy

    environment:
      NODE_ENV: production
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set; use db as the hostname inside Compose}"

    networks:
      - codeline_internal

volumes:
  postgres_data:
  uploads_data:

networks:
  codeline_internal:
    driver: bridge
