services:
  db:
    image: postgres:16-alpine
    container_name: codeline-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - codeline_internal

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: codeline-app
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

      AUTH_SECRET: ${AUTH_SECRET}

      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      APP_URL: ${APP_URL}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}

      STORAGE_DRIVER: ${STORAGE_DRIVER}
      STORAGE_LOCAL_DIR: ${STORAGE_LOCAL_DIR}

      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}

      AI_PROVIDER: ${AI_PROVIDER}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}
      GROQ_MAX_COMPLETION_TOKENS: ${GROQ_MAX_COMPLETION_TOKENS}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      AI_RESEARCH_MAX_SCHOOLS: ${AI_RESEARCH_MAX_SCHOOLS}
      AI_RESEARCH_MAX_SOURCE_REQUESTS_PER_SCHOOL: ${AI_RESEARCH_MAX_SOURCE_REQUESTS_PER_SCHOOL}
      GROQ_ASSISTANT_MODEL: ${GROQ_ASSISTANT_MODEL}
      GEMINI_ASSISTANT_MODEL: ${GEMINI_ASSISTANT_MODEL}

    expose:
      - "3000"

    networks:
      - codeline_internal

  migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator

    container_name: codeline-migrator

    depends_on:
      db:
        condition: service_healthy

    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

    networks:
      - codeline_internal

volumes:
  postgres_data:

networks:
  codeline_internal:
    driver: bridge